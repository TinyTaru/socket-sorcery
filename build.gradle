plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Trinkets Updated (accessory slots) — the maintained eu.pb4 fork.
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/releases"
	}
	// JEI (the recipe viewer).
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	// Cloth Config (the config library).
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	// Patchouli publishes only a snapshot for 26.1 to its own maven, and TerraformersMC's maven has
	// not seen a ModMenu release since May 2026 — both come from Modrinth instead.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"socket-sorcery" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	// Minecraft 26.1 ships unobfuscated, so there is no mappings declaration and no remapping:
	// mod dependencies use the plain Gradle configurations, not the old mod* ones.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets provides the worn accessory slots (necklace / bangle / ring).
	implementation "eu.pb4:trinkets:${project.trinkets_version}"

	// Patchouli powers the in-game guidebook (hard dependency).
	implementation "maven.modrinth:patchouli:${project.patchouli_version}"

	// Cloth Config provides the config file + screen (hard dependency).
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// JEI and ModMenu are optional integrations: compile against them, run them in dev.
	compileOnly "mezz.jei:jei-${project.jei_mc}-fabric-api:${project.jei_version}"
	localRuntime "mezz.jei:jei-${project.jei_mc}-fabric:${project.jei_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
